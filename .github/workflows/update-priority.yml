name: Update listings (priority fast lane)

# Refresh the curated hot-company ATS boards every 15 minutes and publish the
# small pages/priority.json fast-lane feed. Only that file is committed — the
# full listings.json/searchtern.json are ~60MB and stay on the 4-hourly cadence.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Deliberately its own group. Sharing `job-listings` with the tier runs made
# every priority tick queue behind a 3-10 minute medium/heavy/all run, and
# GitHub cancels the older *pending* run in a group, so most 15-minute ticks
# never executed (measured: 9 of 185 feed-change gaps were <= 15 min).
concurrency:
  group: job-listings-priority
  cancel-in-progress: false

jobs:
  priority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Listings/requirements-dev.txt

      - name: Run tests
        run: cd Listings && python -m pytest -q

      # Polls the priority boards with no cooldown (see Listings/priority_boards.py)
      # and rewrites pages/priority.json. The main feeds are rebuilt from the
      # committed tier caches but deliberately not committed here.
      - name: Run scraper (priority tier)
        # Shards stay off until the reader migrates: publishing both the
        # monolithic JSON and 14.5 MB of parts would grow .git by ~170 MB/day.
        env:
          SEARCHTERN_SHARDS: "0"
        run: cd Listings && python generate_listings.py --tier priority

      - name: Commit and push fast-lane feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/priority.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update priority fast-lane feed [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push succeeded."
                exit 0
              fi
              echo "Push rejected (attempt $i/5); merging origin/main and retrying in 20s..."
              # A shorter run lands its commit while this one is still scraping,
              # so losing the push race is normal. Never rebase here: the cache
              # parquet files are binary, a rebase over a concurrent run cannot
              # merge them, and because `run:` is bash -e the failed pull killed
              # the whole step in ~10s instead of retrying (heavy #259-#261).
              # Merge and keep the remote copy of anything both runs rewrote;
              # the next run rebuilds these caches anyway.
              git fetch origin main || true
              if ! git merge --no-edit -X theirs origin/main; then
                while read -r path; do
                  git checkout --theirs -- "$path" 2>/dev/null || git rm -q -f -- "$path"
                done < <(git diff --name-only --diff-filter=U)
                git add -A || true
                git commit --no-edit --no-verify || true
              fi
              sleep 20
            done
            echo "Push failed after 5 attempts."
            exit 1
          fi
