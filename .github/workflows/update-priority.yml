name: Update listings (priority fast lane)

# Refresh the curated hot-company ATS boards every 15 minutes and publish the
# small pages/priority.json fast-lane feed. Only that file is committed — the
# full listings.json/searchtern.json are ~60MB and stay on the 4-hourly cadence.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-listings
  cancel-in-progress: false

jobs:
  priority:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas pyarrow
          python -m pip install requests
          python -m pip install python-jobspy
          python -m pip install protego requests-cache

      # Polls the priority boards with no cooldown (see Listings/priority_boards.py)
      # and rewrites pages/priority.json. The main feeds are rebuilt from the
      # committed tier caches but deliberately not committed here.
      - name: Run scraper (priority tier)
        run: cd Listings && python generate_listings.py --tier priority

      - name: Commit and push fast-lane feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/priority.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update priority fast-lane feed [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push succeeded."
                exit 0
              fi
              echo "Push failed (attempt $i/5), pulling remote changes and retrying in 20s..."
              git pull --rebase --autostash -X theirs origin main
              sleep 20
            done
            echo "Push failed after 5 attempts."
            exit 1
          fi
