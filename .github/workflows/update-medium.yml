name: Update listings (medium)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-listings
  cancel-in-progress: false

jobs:
  medium:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas pyarrow
          python -m pip install requests

      - name: Run scraper (freehire API)
        run: cd Listings && python generate_listings.py --tier medium

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md pages/ Listings/cache/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update job listings [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push succeeded."
                exit 0
              fi
              echo "Push failed (attempt $i/5), pulling remote changes and retrying in 20s..."
              git pull --rebase --autostash origin main
              sleep 20
            done
            echo "Push failed after 5 attempts."
            exit 1
          fi