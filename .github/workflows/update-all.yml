name: Update listings (all tiers)

on:
  schedule:
    - cron: '35 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas pyarrow
          python -m pip install requests
          python -m pip install python-jobspy
          python -m pip install protego requests-cache
          python -m pip install pytest

      - name: Run tests
        run: cd Listings && python -m pytest -q

      # --ecr crawls ~6.4k ECR URLs (~30min). Only this 4-hourly run pays that
      # cost and refreshes Listings/cache/tier_ecr.parquet; the hourly light and
      # 2/4-hourly medium+heavy runs reuse that cache via _load_cached('ecr'),
      # because the ECR merge is unconditional and they would otherwise drop
      # these rows from pages/listings.json when they rewrite it.
      - name: Run scraper (all tiers)
        # Shards stay off until the reader migrates: publishing both the
        # monolithic JSON and 14.5 MB of parts would grow .git by ~170 MB/day.
        env:
          SEARCHTERN_SHARDS: "0"
          SEARCHTERN_FEED_DELIVERY: "release"
          SEARCHTERN_RELEASE_TAG: "feed-latest"
          SEARCHTERN_REPO: ${{ github.repository }}
        run: cd Listings && python generate_listings.py --tier all --ecr

      - name: Publish feed assets
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCHTERN_RELEASE_TAG: "feed-latest"
        run: |
          set -euo pipefail
          tag="$SEARCHTERN_RELEASE_TAG"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "SearchTern feed" \
              --notes "Rolling latest generated feed assets." --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" pages/searchtern.json pages/listings.json --clobber
          rm -rf /tmp/searchtern-assets && mkdir -p /tmp/searchtern-assets
          gh release download "$tag" --pattern searchtern.json --dir /tmp/searchtern-assets --clobber
          gh release download "$tag" --pattern listings.json --dir /tmp/searchtern-assets --clobber
          python - <<'PY'
          import hashlib, json, pathlib
          manifest = json.load(open("pages/feed-manifest.json", encoding="utf-8"))
          for name in ("searchtern", "listings"):
              entry = manifest["published"][name]
              raw = (pathlib.Path("/tmp/searchtern-assets") / f"{name}.json").read_bytes()
              if len(raw) != int(entry["bytes"]):
                  raise SystemExit(f"{name}: downloaded {len(raw)} bytes != manifest {entry['bytes']}")
              if hashlib.sha256(raw).hexdigest() != entry["sha256"]:
                  raise SystemExit(f"{name}: downloaded sha256 does not match manifest")
          print("release assets verified against manifest")
          PY
          # The feed is a release asset now; restore the compatibility copy so
          # the commit contains only the small manifest/README/cache surface.
          git checkout -- pages/searchtern.json pages/listings.json

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicitly excluding the priority fast-lane file: this run rebuilds
          # from tier caches and must not publish over the 15-minute lane.
          git add README.md pages/ countries/ digests/ Listings/cache/ \
            ':(exclude)pages/priority.json' \
            ':(exclude)pages/searchtern.json' \
            ':(exclude)pages/listings.json'
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update job listings [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push succeeded."
                exit 0
              fi
              echo "Push failed (attempt $i/5), pulling remote changes and retrying in 20s..."
              git pull --rebase --autostash -X theirs origin main
              sleep 20
            done
            echo "Push failed after 5 attempts."
            exit 1
          fi