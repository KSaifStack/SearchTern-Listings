name: Update listings (heavy)

on:
  schedule:
    - cron: '50 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-listings
  cancel-in-progress: false

jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Listings/requirements-dev.txt

      - name: Run tests
        run: cd Listings && python -m pytest -q

      - name: Run scraper (ATS probe - rate limited)
        # Shards ship beside the monolithic feed as release assets. They are
        # no longer committed, so the extra ~14.5 MB costs the repo nothing.
        env:
          SEARCHTERN_SHARDS: "1"
          SEARCHTERN_FEED_DELIVERY: "release"
          SEARCHTERN_RELEASE_TAG: "feed-latest"
          SEARCHTERN_REPO: ${{ github.repository }}
        run: cd Listings && python generate_listings.py --tier heavy --force

      - name: Publish feed assets
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCHTERN_RELEASE_TAG: "feed-latest"
        run: |
          set -euo pipefail
          tag="$SEARCHTERN_RELEASE_TAG"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "SearchTern feed" \
              --notes "Rolling latest generated feed assets." --target "$GITHUB_SHA"
          fi
          assets=(pages/searchtern.json pages/listings.json)
          if [ -f pages/manifest.json ]; then
            assets+=(pages/manifest.json pages/shards/*.json.gz)
          fi
          gh release upload "$tag" "${assets[@]}" --clobber
          rm -rf /tmp/searchtern-assets && mkdir -p /tmp/searchtern-assets
          gh release download "$tag" --pattern searchtern.json --dir /tmp/searchtern-assets --clobber
          gh release download "$tag" --pattern listings.json --dir /tmp/searchtern-assets --clobber
          python - <<'PY'
          import hashlib, json, pathlib
          manifest = json.load(open("pages/feed-manifest.json", encoding="utf-8"))
          for name in ("searchtern", "listings"):
              entry = manifest["published"][name]
              raw = (pathlib.Path("/tmp/searchtern-assets") / f"{name}.json").read_bytes()
              if len(raw) != int(entry["bytes"]):
                  raise SystemExit(f"{name}: downloaded {len(raw)} bytes != manifest {entry['bytes']}")
              if hashlib.sha256(raw).hexdigest() != entry["sha256"]:
                  raise SystemExit(f"{name}: downloaded sha256 does not match manifest")
          print("release assets verified against manifest")
          PY
          # The feed is a release asset only; the checkout no longer carries it.

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicitly excluding the priority fast-lane file: this tier rebuilds
          # from tier caches and must not publish over the 15-minute lane.
          git add README.md pages/ countries/ Listings/cache/ \
            ':(exclude)pages/priority.json'
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update job listings [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push succeeded."
                exit 0
              fi
              echo "Push failed (attempt $i/5), pulling remote changes and retrying in 20s..."
              git pull --rebase --autostash -X theirs origin main
              sleep 20
            done
            echo "Push failed after 5 attempts."
            exit 1
          fi